name: Version packages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: changesets-version-main
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - run: pnpm version:check
      - name: Check Preview pre mode
        id: preview
        run: |
          node --input-type=module <<'EOF'
          import { appendFileSync, existsSync, readFileSync } from 'node:fs'

          if (!existsSync('.changeset/pre.json')) {
            console.log('Preview pre mode has not been entered; refusing to create a stable version PR.')
            appendFileSync(process.env.GITHUB_OUTPUT, 'ready=false\n')
            process.exit(0)
          }

          const state = JSON.parse(readFileSync('.changeset/pre.json', 'utf8'))
          if (state.mode !== 'pre' || state.tag !== 'preview') {
            throw new Error('Expected Changesets pre mode with the preview tag.')
          }
          appendFileSync(process.env.GITHUB_OUTPUT, 'ready=true\n')
          EOF
      - name: Open or update the Changesets version PR
        if: steps.preview.outputs.ready == 'true'
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        with:
          create-github-releases: false
          push-git-tags: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
